<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist Olimpiade Geografi – 6 Hari</title>
<style>
:root{--bg:#fbf3e6;--card:#fffaf1;--ink:#4a3426;--mute:#8a7260;--line:#ecd9bd;--accent:#d9622b;--accent2:#f0a640;--done:#7a9a5b;--soft:#fbe4cc;--shadow:0 6px 18px rgba(120,70,30,.10);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1f18;--card:#35281f;--ink:#f6e8d6;--mute:#c2a88f;--line:#4d3a2c;--accent:#f08a4b;--accent2:#f3b562;--done:#a6c183;--soft:#4a3426;--shadow:0 6px 18px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#2a1f18;--card:#35281f;--ink:#f6e8d6;--mute:#c2a88f;--line:#4d3a2c;--accent:#f08a4b;--accent2:#f3b562;--done:#a6c183;--soft:#4a3426;--shadow:0 6px 18px rgba(0,0,0,.3)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 60px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0}
header{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow)}
header h1{font-size:1.65rem;line-height:1.2}
header p{margin:6px 0 0;opacity:.95}
.top{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:16px}
.chip{background:rgba(255,255,255,.22);border-radius:14px;padding:8px 14px;font-size:.92rem}
.chip b{font-size:1.25rem}
.ringbox{display:flex;align-items:center;gap:12px;margin-left:auto}
.ring{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#fff var(--p,0%),rgba(255,255,255,.28) 0)}
.ring span{width:58px;height:58px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:700}
.dateline{margin-top:12px;font-size:.88rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dateline input{border:0;border-radius:8px;padding:4px 8px;font:inherit;background:rgba(255,255,255,.9);color:#4a3426}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:18px 0}
.tab{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:8px 4px;cursor:pointer;font:inherit;text-align:center;transition:.2s}
.tab:hover{transform:translateY(-2px)}
.tab .ic{font-size:1.3rem;display:block}
.tab small{display:block;color:var(--mute);font-size:.72rem}
.tab .mini{height:5px;border-radius:5px;background:var(--line);margin-top:5px;overflow:hidden}
.tab .mini i{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
.tab.active{border-color:var(--accent);background:var(--soft);box-shadow:var(--shadow)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.panel h2{font-size:1.4rem}
.sub{color:var(--mute);margin:4px 0 12px}
.bar{height:12px;border-radius:12px;background:var(--line);overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--done));transition:width .4s}
.warn{background:var(--soft);border-left:5px solid var(--accent);padding:10px 12px;border-radius:10px;margin:12px 0;font-size:.92rem}
.sec{margin-top:18px}
.sec h3{font-size:1.05rem;color:var(--accent);margin-bottom:6px}
.item{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--bg);transition:.2s;user-select:none}
.item:hover{border-color:var(--accent2);transform:translateX(3px)}
.box{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--accent);display:grid;place-items:center;color:transparent;font-weight:700;transition:.2s;margin-top:1px}
.item.done .box{background:var(--done);border-color:var(--done);color:#fff;transform:scale(1.08)}
.item.done .txt{text-decoration:line-through;color:var(--mute)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button.btn{border:0;border-radius:12px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;transition:.2s}
button.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
button.btn.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.tools{margin-top:18px;padding:16px;border-radius:16px;background:var(--soft)}
.timer{font-family:Georgia,serif;font-size:2.6rem;text-align:center;letter-spacing:2px}
.trow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
select{font:inherit;border-radius:10px;border:1px solid var(--line);padding:7px;background:var(--card);color:var(--ink)}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.mrow .nm{flex:1}
.mrow button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.1rem;cursor:pointer}
.mrow .n{min-width:26px;text-align:center;font-weight:700}
.weak{margin-top:12px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--accent);color:#fff;padding:12px 20px;border-radius:30px;box-shadow:var(--shadow);opacity:0;transition:.35s;pointer-events:none;z-index:20;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.pc{position:fixed;top:-20px;font-size:1.4rem;z-index:30;pointer-events:none;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.3}}
footer{text-align:center;color:var(--mute);font-size:.85rem;margin-top:22px}
@media (max-width:560px){.tabs{gap:5px}.tab small{display:none}.ringbox{margin-left:0}header h1{font-size:1.35rem}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🔥 Misi 6 Hari Menuju Olimpiade</h1>
  <p>Olimpiade: Sabtu, 24 Oktober 2026. Satu langkah kecil tiap hari, centang sampai tuntas.</p>
  <div class="top">
    <div class="chip">⏳ <b id="cd">–</b> hari lagi</div>
    <div class="chip">✅ <b id="cnt">0</b> / <span id="tot">0</span> tugas</div>
    <div class="ringbox"><div class="ring" id="ring"><span id="rp">0%</span></div></div>
  </div>
  <div class="dateline">📅 Hari 1 dimulai:
    <input type="date" id="start" value="2026-10-19">
  </div>
</header>
<nav class="tabs" id="tabs"></nav>
<main class="panel" id="panel"></main>
<footer>Progres tersimpan otomatis di peramban ini. Semangat, kamu pasti bisa! 🌻</footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
var CONTEST=new Date(2026,9,24);
var MONTHS=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
var DAYNAMES=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];

var DAYS=[
{icon:"🌬️",short:"Iklim",title:"Sirkulasi Global & Iklim",secs:[
 {h:"Sirkulasi & angin",items:["Gambar sel Hadley, Ferrel, dan Polar beserta lintang batasnya (0°, 30°, 60°, 90°)","Tandai zona ITCZ, subtropis tekanan tinggi, dan front polar","Pahami angin pasat, angin barat, dan angin timur kutub","Jelaskan efek Coriolis: belok kanan di BBU, belok kiri di BBS","Bedakan angin lokal: darat–laut, gunung–lembah, fohn, monsun"]},
 {h:"Tekanan, massa udara & front",items:["Hubungan suhu, ketinggian, dan tekanan udara; gradien tekanan memicu angin","Klasifikasi massa udara (cA, cP, cT, mP, mT) dan sifatnya","Bedakan front dingin, hangat, oklusi, dan stasioner beserta cuacanya","Baca simbol front pada peta cuaca sederhana"]},
 {h:"Iklim & presipitasi",items:["Faktor pengendali iklim: lintang, ketinggian, daratan–lautan, arus laut","Klasifikasi iklim Koppen, Schmidt–Ferguson, dan Oldeman (inti saja)","Jenis hujan: konvektif, orografis, frontal, siklonik","Fenomena ENSO, La Nina, dan IOD pengaruhnya ke Indonesia","Latihan: 5 soal tentang sirkulasi dan iklim"]}]},
{icon:"🌋",short:"Geomorfologi",title:"Tenaga Endogen, Eksogen & Bentang Alam",secs:[
 {h:"Tenaga endogen",items:["Teori tektonik lempeng: divergen, konvergen, transform","Jenis tektonisme: orogenesa, epirogenesa, seisme, lipatan, patahan","Anatomi gunung api: tipe (perisai, strato, kaldera) dan material erupsi","Posisi Indonesia: Cincin Api dan zona subduksi utama"]},
 {h:"Tenaga eksogen",items:["Pelapukan fisik, kimia, dan biologi beserta faktor penyebabnya","Erosi, transportasi, dan sedimentasi oleh air, angin, es, dan gelombang","Batuan beku, sedimen, dan metamorf serta siklus batuan"]},
 {h:"Bentang alam",items:["Bentuk lahan fluvial: meander, oxbow, delta, dataran banjir","Bentuk lahan karst, glasial, aeolian, dan marin","Bentuk lahan vulkanik dan struktural (horst, graben, antiklin, sinklin)","Latihan: cocokkan 10 bentang alam dengan proses pembentuknya"]}]},
{icon:"💧",short:"Hidrologi",title:"Hidrologi & DAS",secs:[
 {h:"Siklus & air tanah",items:["Gambar siklus hidrologi lengkap (evaporasi, transpirasi, kondensasi, presipitasi)","Infiltrasi dan faktor yang memengaruhinya (tekstur tanah, vegetasi, kemiringan)","Akuifer bebas, tertekan, muka air tanah, dan mata air"]},
 {h:"DAS, sungai & banjir",items:["Komponen DAS, batas topografi, dan pola aliran (dendritik, radial, trellis, dll.)","Orde sungai (Strahler), debit, dan hidrograf","Faktor limpasan permukaan dan hubungannya dengan tata guna lahan","Penyebab dan mitigasi banjir (struktural dan non-struktural)"]},
 {h:"Neraca air",items:["Rumus neraca air: P = ET + Q + ΔS","Hitung contoh neraca air sederhana (surplus dan defisit)","Latihan: 5 soal hitungan hidrologi"]}]},
{icon:"🗺️",short:"Spasial",title:"Data Spasial & Analisis Dasar",secs:[
 {h:"Data & struktur",items:["Bedakan data spasial dan atribut serta contohnya","Raster vs vektor: kelebihan, kekurangan, dan penggunaan","Tiga tipe vektor: titik, garis, poligon","Pahami piksel, resolusi spasial raster, dan topologi dasar"]},
 {h:"Skala & koordinat",items:["Skala numerik, grafis, verbal, dan perhitungan jarak peta ke lapangan","Skala besar vs kecil serta tingkat kedetailannya","Koordinat geografis (lintang–bujur) vs UTM dan zona UTM Indonesia","Pahami datum dan proyeksi peta (WGS84, Mercator, dll.)"]},
 {h:"Analisis spasial",items:["Overlay: intersect, union, clip, erase","Buffering dan contoh penerapannya (sempadan sungai, radius layanan)","Query atribut dan skoring/pembobotan sederhana","Latihan: rancang analisis kesesuaian lahan dengan overlay"]}]},
{icon:"🛰️",short:"Citra",title:"Penginderaan Jauh & Interpretasi Citra",secs:[
 {h:"Sensor & spektrum",items:["Sensor pasif vs aktif (contoh: Landsat, Sentinel-2, radar SAR, LiDAR)","Spektrum elektromagnetik: tampak, inframerah dekat, termal, gelombang mikro","Jendela atmosfer dan interaksi energi dengan objek","Pola pantulan spektral vegetasi, air, dan tanah"]},
 {h:"Resolusi citra",items:["Resolusi spasial, spektral, radiometrik, dan temporal","Kombinasi band: warna alami vs komposit semu (NIR-R-G)","Pahami indeks sederhana seperti NDVI"]},
 {h:"Interpretasi citra",items:["Hafalkan 8 unsur interpretasi: rona/warna, bentuk, ukuran, pola, tekstur, bayangan, situs, asosiasi","Kenali objek: sungai, hutan, sawah, permukiman, tambak, lahan terbuka","Latihan: interpretasi 3 contoh citra dengan 8 unsur"]}]},
{icon:"🏆",short:"Simulasi",title:"Simulasi UISO & Evaluasi Kelemahan",secs:[
 {h:"Simulasi",items:["Kerjakan contoh soal UISO dengan batas waktu ketat","Jangan buka catatan selama simulasi, tandai soal yang ragu","Koreksi jawaban dan hitung skor"]},
 {h:"Evaluasi",items:["Catat setiap kesalahan berdasarkan 5 materi (gunakan penghitung di bawah)","Tentukan dua kelemahan terbesar","Pelajari ulang dua materi terlemah sampai paham","Tidur cukup dan siapkan perlengkapan ujian"]}]}
];

var TOPICS=["Sirkulasi & Iklim","Geomorfologi","Hidrologi & DAS","Data Spasial","Penginderaan Jauh"];

var state={checked:{},mistakes:[0,0,0,0,0],start:"2026-10-19",active:0};
try{var raw=localStorage.getItem("olim-geo-v1");if(raw){var s=JSON.parse(raw);if(s&&typeof s==="object"){state.checked=s.checked||{};state.mistakes=Array.isArray(s.mistakes)&&s.mistakes.length===5?s.mistakes:state.mistakes;state.start=s.start||state.start;state.active=+s.active||0}}}catch(e){}
function save(){try{localStorage.setItem("olim-geo-v1",JSON.stringify(state))}catch(e){}}

function $(id){return document.getElementById(id)}
function dayStats(d){var t=0,c=0;DAYS[d].secs.forEach(function(sec,si){sec.items.forEach(function(_,ii){t++;if(state.checked["d"+d+"-"+si+"-"+ii])c++})});return{t:t,c:c}}
function parseDate(str){var p=(str||"").split("-");if(p.length!==3)return new Date(2026,9,19);return new Date(+p[0],+p[1]-1,+p[2])}
function dayDate(d){var s=parseDate(state.start);return new Date(s.getFullYear(),s.getMonth(),s.getDate()+d)}
function fmt(dt){return DAYNAMES[dt.getDay()]+", "+dt.getDate()+" "+MONTHS[dt.getMonth()]}
function toast(msg){var t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("show")},2600)}
function confetti(){var e=["🎉","🌻","✨","🍂","🧡","⭐"];for(var i=0;i<26;i++){var p=document.createElement("span");p.className="pc";p.textContent=e[i%e.length];p.style.left=Math.random()*100+"vw";p.style.animationDelay=(Math.random()*0.6)+"s";document.body.appendChild(p);(function(x){setTimeout(function(){x.remove()},3200)})(p)}}

function renderTop(){
 var T=0,C=0;DAYS.forEach(function(_,d){var s=dayStats(d);T+=s.t;C+=s.c});
 var pct=T?Math.round(C/T*100):0;
 $("cnt").textContent=C;$("tot").textContent=T;$("rp").textContent=pct+"%";$("ring").style.setProperty("--p",pct+"%");
 var now=new Date();var today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 var diff=Math.round((CONTEST-today)/86400000);
 $("cd").textContent=diff>0?diff:(diff===0?"0 (hari H!)":"selesai");
}
function renderTabs(){
 var h="";
 DAYS.forEach(function(D,d){var s=dayStats(d);var pc=s.t?Math.round(s.c/s.t*100):0;
  h+='<button class="tab'+(d===state.active?' active':'')+'" data-day="'+d+'"><span class="ic">'+D.icon+'</span><b>H'+(d+1)+'</b><small>'+D.short+'</small><div class="mini"><i style="width:'+pc+'%"></i></div></button>'});
 $("tabs").innerHTML=h;
}
function renderPanel(){
 var d=state.active,D=DAYS[d],s=dayStats(d),pc=s.t?Math.round(s.c/s.t*100):0,dt=dayDate(d);
 var h='<h2>'+D.icon+' Hari '+(d+1)+': '+D.title+'</h2><div class="sub">'+fmt(dt)+' · '+s.c+' dari '+s.t+' tugas selesai</div>';
 h+='<div class="bar"><i style="width:'+pc+'%"></i></div>';
 if(dt>=CONTEST){h+='<div class="warn">⚠️ Tanggal hari ini bertepatan dengan atau melewati hari olimpiade (24 Okt). Gabungkan materi hari ini ke hari sebelumnya atau percepat jadwalmu.</div>'}
 else if(d===5){h+='<div class="warn">💡 Simulasi hari terakhir paling efektif jika dikerjakan dalam sekali duduk tanpa gangguan.</div>'}
 D.secs.forEach(function(sec,si){
  h+='<div class="sec"><h3>'+sec.h+'</h3>';
  sec.items.forEach(function(it,ii){var id="d"+d+"-"+si+"-"+ii;var on=state.checked[id];
   h+='<div class="item'+(on?' done':'')+'" data-id="'+id+'" role="checkbox" aria-checked="'+(on?'true':'false')+'" tabindex="0"><div class="box">✓</div><div class="txt">'+it+'</div></div>'});
  h+='</div>'});
 if(d===5){
  h+='<div class="tools"><h3>⏱️ Timer Simulasi</h3><div class="timer" id="tm">90:00</div><div class="trow"><select id="tsel"><option value="60">60 menit</option><option value="90" selected>90 menit</option><option value="120">120 menit</option><option value="150">150 menit</option></select><button class="btn" id="tgo">Mulai</button><button class="btn alt" id="trs">Reset</button></div></div>';
  h+='<div class="tools"><h3>📝 Catatan Kesalahan per Materi</h3>';
  TOPICS.forEach(function(n,i){h+='<div class="mrow"><span class="nm">'+n+'</span><button data-m="'+i+'" data-v="-1" aria-label="Kurangi">−</button><span class="n">'+state.mistakes[i]+'</span><button data-m="'+i+'" data-v="1" aria-label="Tambah">+</button></div>'});
  h+='<div class="weak" id="weak"></div></div>';
 }
 h+='<div class="actions"><button class="btn" id="all">Centang semua hari ini</button><button class="btn alt" id="clr">Kosongkan hari ini</button><button class="btn alt" id="rst">Reset semua</button></div>';
 $("panel").innerHTML=h;
 if(d===5){renderWeak();setupTimer()}
}
function renderWeak(){
 var el=$("weak");if(!el)return;
 var arr=TOPICS.map(function(n,i){return{n:n,v:state.mistakes[i]}}).filter(function(x){return x.v>0}).sort(function(a,b){return b.v-a.v}).slice(0,2);
 el.textContent=arr.length?"🎯 Dua kelemahan terbesar: "+arr.map(function(x){return x.n+" ("+x.v+" salah)"}).join(" dan "):"Belum ada kesalahan tercatat. Tambahkan setelah koreksi.";
}

var timer={left:90*60,run:false,h:null};
function tfmt(s){var m=Math.floor(s/60),r=s%60;return(m<10?"0":"")+m+":"+(r<10?"0":"")+r}
function setupTimer(){
 var tm=$("tm"),go=$("tgo"),rs=$("trs"),sel=$("tsel");
 clearInterval(timer.h);timer.run=false;timer.left=+sel.value*60;tm.textContent=tfmt(timer.left);
 sel.onchange=function(){clearInterval(timer.h);timer.run=false;go.textContent="Mulai";timer.left=+sel.value*60;tm.textContent=tfmt(timer.left)};
 go.onclick=function(){
  if(timer.run){clearInterval(timer.h);timer.run=false;go.textContent="Lanjut";return}
  timer.run=true;go.textContent="Jeda";
  timer.h=setInterval(function(){timer.left--;tm.textContent=tfmt(Math.max(timer.left,0));
   if(timer.left<=0){clearInterval(timer.h);timer.run=false;go.textContent="Mulai";toast("⏰ Waktu habis! Kumpulkan jawabanmu.")}},1000)};
 rs.onclick=function(){clearInterval(timer.h);timer.run=false;go.textContent="Mulai";timer.left=+sel.value*60;tm.textContent=tfmt(timer.left)};
}
function refreshAll(){renderTop();renderTabs();renderPanel()}

function toggle(id){
 var d=+id.split("-")[0].slice(1);
 var before=dayStats(d).c===dayStats(d).t;
 if(state.checked[id])delete state.checked[id];else state.checked[id]=true;
 save();
 var s=dayStats(d);
 refreshAll();
 if(!before&&s.c===s.t){confetti();toast("🎉 Hari "+(d+1)+" selesai! Kerja bagus!")}
}

$("panel").addEventListener("click",function(ev){
 var it=ev.target.closest(".item");
 if(it){toggle(it.getAttribute("data-id"));return}
 var mb=ev.target.closest("button[data-m]");
 if(mb){var i=+mb.getAttribute("data-m"),v=+mb.getAttribute("data-v");state.mistakes[i]=Math.max(0,state.mistakes[i]+v);save();
  var row=mb.parentNode;row.querySelector(".n").textContent=state.mistakes[i];renderWeak();return}
 var d=state.active;
 if(ev.target.id==="all"||ev.target.id==="clr"){
  DAYS[d].secs.forEach(function(sec,si){sec.items.forEach(function(_,ii){var id="d"+d+"-"+si+"-"+ii;if(ev.target.id==="all")state.checked[id]=true;else delete state.checked[id]})});
  save();refreshAll();if(ev.target.id==="all"){confetti();toast("🎉 Semua tugas hari ini selesai!")}
 }
 if(ev.target.id==="rst"){if(window.confirm("Reset semua progres dan catatan?")){state.checked={};state.mistakes=[0,0,0,0,0];save();refreshAll();toast("Progres direset.")}}
});
$("panel").addEventListener("keydown",function(ev){
 if((ev.key==="Enter"||ev.key===" ")&&ev.target.classList.contains("item")){ev.preventDefault();toggle(ev.target.getAttribute("data-id"))}
});
$("tabs").addEventListener("click",function(ev){
 var t=ev.target.closest(".tab");if(!t)return;
 state.active=+t.getAttribute("data-day");save();clearInterval(timer.h);renderTabs();renderPanel();
});
$("start").value=state.start;
$("start").addEventListener("change",function(){if(this.value){state.start=this.value;save();renderPanel()}});

if(state.active<0||state.active>5)state.active=0;
refreshAll();
})();
</script>
</body>
</html>
